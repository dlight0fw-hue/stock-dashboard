<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S&amp;P 500 Stock Heatmap</title>
  <style>
    html, body { width: 100%; min-height: 100%; margin: 0; background: #fff; }
    body { display: flex; justify-content: center; overflow-x: auto; }
    main { width: 100%; max-width: 1200px; margin: 0 auto; }
    .tradingview-widget-container, .tradingview-widget-container__widget {
      width: 1200px; max-width: 100%; height: 600px; margin: 0 auto;
    }
  </style>
</head>
<body>
  <main>
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
      {
        "dataSource": "SPX500",
        "blockSize": "market_cap_basic",
        "blockColor": "change",
        "grouping": "sector",
        "locale": "kr",
        "symbolUrl": "",
        "colorTheme": "light",
        "exchanges": [],
        "hasTopBar": true,
        "isDataSetEnabled": true,
        "isZoomEnabled": true,
        "hasSymbolTooltip": true,
        "isMonoSize": false,
        "width": 1200,
        "height": 600
      }
      </script>
    </div>
  </main>
</body>
</html>
